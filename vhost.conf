<VirtualHost *:80>
    # Apuntamos directamente a la carpeta public, donde vive el index.php
    DocumentRoot /var/www/html/api-laravel/public

    <Directory /var/www/html/api-laravel/public>
        # Permitimos el uso de archivos .htaccess para que Laravel maneje las rutas
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
